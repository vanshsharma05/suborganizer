<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Returning to SubOrganizer…</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fdfbf7;
        color: #2b2b2b;
        padding: 24px;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #17150f; color: #f0ece4; }
      }
      .card { max-width: 26rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1rem; opacity: .8; }
      a {
        display: inline-block;
        padding: .6rem 1.2rem;
        border-radius: 999px;
        background: #d36043;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .err { color: #b3261e; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Returning to SubOrganizer…</h1>
      <p id="msg">One moment.</p>
      <a id="manual" style="display:none">Open SubOrganizer</a>
    </div>

    <script>
      // Development bounce for Expo Go.
      //
      // Expo Go cannot own the app's custom URL scheme, and Google will not
      // redirect to an `exp://` address — so Google is pointed here instead,
      // and this page forwards the authorization code on to the running Expo
      // Go session. Real builds never touch this page.
      //
      // The forwarding target arrives in `state`. Only `exp://` is accepted:
      // redirecting to an arbitrary attacker-supplied URL would turn this into
      // an open redirect carrying a live OAuth code.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var target = params.get('state') || '';
        var code = params.get('code');
        var error = params.get('error');
        var title = document.getElementById('title');
        var msg = document.getElementById('msg');
        var manual = document.getElementById('manual');

        function fail(text) {
          title.textContent = 'Could not return to the app';
          msg.className = 'err';
          msg.textContent = text;
        }

        if (error) {
          fail(params.get('error_description') || error);
          return;
        }
        if (!/^exp:\/\//.test(target)) {
          fail('Unexpected return address. Nothing was forwarded.');
          return;
        }
        if (!code) {
          fail('Google did not return an authorization code.');
          return;
        }

        var joiner = target.indexOf('?') === -1 ? '?' : '&';
        var next = target + joiner + 'code=' + encodeURIComponent(code);

        // Some Android browsers block an automatic custom-scheme navigation, so
        // a tappable link is left behind whenever the redirect does not take.
        manual.href = next;
        manual.style.display = 'inline-block';
        window.location.replace(next);
      })();
    </script>
  </body>
</html>
